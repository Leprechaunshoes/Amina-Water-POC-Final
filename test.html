<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amina Counter Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background: #071821;
      color: #e8f7ff;
    }
    h1 { color: #39d0ff; }
    .test-section {
      background: rgba(255,255,255,0.05);
      padding: 20px;
      border-radius: 10px;
      margin: 20px 0;
    }
    .test-btn {
      background: #184d63;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin: 5px;
    }
    .test-btn:hover {
      background: #1f5a72;
    }
    .result {
      background: rgba(0,255,0,0.1);
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
      border-left: 4px solid #76ffd7;
    }
    .error {
      background: rgba(255,0,0,0.1);
      border-left: 4px solid #ff5555;
    }
    pre {
      background: rgba(0,0,0,0.3);
      padding: 10px;
      border-radius: 5px;
      overflow-x: auto;
      font-size: 14px;
    }
    .status {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
      margin-left: 10px;
    }
    .status.ok { background: #76ffd7; color: #071821; }
    .status.fail { background: #ff5555; color: white; }
  </style>
</head>
<body>
  <h1>🧪 Amina Counter Test Page</h1>
  <p>Use this page to verify your swap counter is working correctly.</p>

  <div class="test-section">
    <h2>1. Check Backend Status</h2>
    <button class="test-btn" onclick="checkBackend()">Test Backend Connection</button>
    <div id="backend-result"></div>
  </div>

  <div class="test-section">
    <h2>2. Get Current Stats</h2>
    <button class="test-btn" onclick="getStats()">Get Stats</button>
    <div id="stats-result"></div>
  </div>

  <div class="test-section">
    <h2>3. Simulate Swap (Increment Counter)</h2>
    <button class="test-btn" onclick="simulateSwap()">Simulate +1 Swap</button>
    <button class="test-btn" onclick="simulateMultiple(5)">Simulate +5 Swaps</button>
    <div id="simulate-result"></div>
  </div>

  <div class="test-section">
    <h2>4. Auto-Refresh Counter</h2>
    <button class="test-btn" onclick="startAutoRefresh()">Start Auto-Refresh</button>
    <button class="test-btn" onclick="stopAutoRefresh()">Stop Auto-Refresh</button>
    <div id="auto-result"></div>
  </div>

  <script>
    // Use the same backend as your main site
    const BACKEND = 'https://amina-water-backend.onrender.com';
    let refreshInterval = null;

    async function checkBackend() {
      const resultDiv = document.getElementById('backend-result');
      resultDiv.innerHTML = '<p>Testing connection...</p>';
      
      try {
        const response = await fetch(BACKEND + '/stats');
        if (response.ok) {
          resultDiv.innerHTML = `
            <div class="result">
              ✅ Backend is online<span class="status ok">CONNECTED</span>
              <pre>URL: ${BACKEND}</pre>
            </div>
          `;
        } else {
          throw new Error('Backend returned error: ' + response.status);
        }
      } catch (error) {
        resultDiv.innerHTML = `
          <div class="result error">
            ❌ Backend is offline<span class="status fail">FAILED</span>
            <pre>Error: ${error.message}</pre>
            <p>Make sure your backend is deployed and running.</p>
          </div>
        `;
      }
    }

    async function getStats() {
      const resultDiv = document.getElementById('stats-result');
      resultDiv.innerHTML = '<p>Fetching stats...</p>';
      
      try {
        const response = await fetch(BACKEND + '/stats', { cache: 'no-store' });
        const data = await response.json();
        
        resultDiv.innerHTML = `
          <div class="result">
            ✅ Stats retrieved successfully
            <pre>${JSON.stringify(data, null, 2)}</pre>
            <p><strong>Counter:</strong> ${data.totalTransfers || 0}</p>
            <p><strong>Last Donation:</strong> ${data.lastDonation || 'None yet'}</p>
          </div>
        `;
      } catch (error) {
        resultDiv.innerHTML = `
          <div class="result error">
            ❌ Failed to fetch stats
            <pre>Error: ${error.message}</pre>
          </div>
        `;
      }
    }

    async function simulateSwap() {
      const resultDiv = document.getElementById('simulate-result');
      resultDiv.innerHTML = '<p>Simulating swap...</p>';
      
      try {
        const beforeResponse = await fetch(BACKEND + '/stats', { cache: 'no-store' });
        const beforeData = await beforeResponse.json();
        const beforeCount = beforeData.totalTransfers || 0;

        await fetch(BACKEND + '/simulate', { method: 'POST' });
        
        // Wait a bit for the backend to update
        await new Promise(resolve => setTimeout(resolve, 500));
        
        const afterResponse = await fetch(BACKEND + '/stats', { cache: 'no-store' });
        const afterData = await afterResponse.json();
        const afterCount = afterData.totalTransfers || 0;
        
        resultDiv.innerHTML = `
          <div class="result">
            ✅ Swap simulated successfully
            <pre>Before: ${beforeCount}
After:  ${afterCount}
Change: +${afterCount - beforeCount}</pre>
            ${afterCount > beforeCount ? 
              '<p><strong>✓ Counter is working!</strong></p>' : 
              '<p style="color: #ff5555;"><strong>⚠ Counter did not increment</strong></p>'}
          </div>
        `;
      } catch (error) {
        resultDiv.innerHTML = `
          <div class="result error">
            ❌ Failed to simulate swap
            <pre>Error: ${error.message}</pre>
          </div>
        `;
      }
    }

    async function simulateMultiple(count) {
      const resultDiv = document.getElementById('simulate-result');
      resultDiv.innerHTML = `<p>Simulating ${count} swaps...</p>`;
      
      try {
        const beforeResponse = await fetch(BACKEND + '/stats', { cache: 'no-store' });
        const beforeData = await beforeResponse.json();
        const beforeCount = beforeData.totalTransfers || 0;

        for (let i = 0; i < count; i++) {
          await fetch(BACKEND + '/simulate', { method: 'POST' });
          await new Promise(resolve => setTimeout(resolve, 200));
        }
        
        const afterResponse = await fetch(BACKEND + '/stats', { cache: 'no-store' });
        const afterData = await afterResponse.json();
        const afterCount = afterData.totalTransfers || 0;
        
        resultDiv.innerHTML = `
          <div class="result">
            ✅ ${count} swaps simulated successfully
            <pre>Before: ${beforeCount}
After:  ${afterCount}
Change: +${afterCount - beforeCount}</pre>
            ${afterCount - beforeCount === count ? 
              '<p><strong>✓ All swaps counted correctly!</strong></p>' : 
              '<p style="color: #ff5555;"><strong>⚠ Counter mismatch</strong></p>'}
          </div>
        `;
      } catch (error) {
        resultDiv.innerHTML = `
          <div class="result error">
            ❌ Failed to simulate swaps
            <pre>Error: ${error.message}</pre>
          </div>
        `;
      }
    }

    function startAutoRefresh() {
      if (refreshInterval) {
        stopAutoRefresh();
      }
      
      const resultDiv = document.getElementById('auto-result');
      resultDiv.innerHTML = '<div class="result">🔄 Auto-refresh started (every 2 seconds)</div>';
      
      refreshInterval = setInterval(async () => {
        try {
          const response = await fetch(BACKEND + '/stats', { cache: 'no-store' });
          const data = await response.json();
          const now = new Date().toLocaleTimeString();
          
          resultDiv.innerHTML = `
            <div class="result">
              🔄 Auto-refresh active
              <pre>Last updated: ${now}
Counter: ${data.totalTransfers || 0}
Last Donation: ${data.lastDonation || 'None'}</pre>
            </div>
          `;
        } catch (error) {
          resultDiv.innerHTML = `
            <div class="result error">
              ❌ Auto-refresh error: ${error.message}
            </div>
          `;
        }
      }, 2000);
    }

    function stopAutoRefresh() {
      if (refreshInterval) {
        clearInterval(refreshInterval);
        refreshInterval = null;
        document.getElementById('auto-result').innerHTML = '<div class="result">⏸️ Auto-refresh stopped</div>';
      }
    }

    // Auto-check backend on load
    window.addEventListener('load', () => {
      checkBackend();
      getStats();
    });
  </script>
</body>
</html>
